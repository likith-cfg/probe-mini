# Source manifest and request-time routing index.
# description tells the agent when to open docs/baseline/<slug>.md.

refresh_interval_days: 30

sources:
  # ── ALERTS ───────────────────────────────────────────────────────────────
  - category: alerts
    slug: gcp-foundation-alerts
    url: "https://gitdocs.sabre.com/gitdocs/gcp-foundation/concepts/alerts.html?format=markdown"
    description: >
      Use for Sabre GKE MonitoringAlertPolicy CRD/Ansible YAML, repository
      placement, SNOW notification channels or documentation JSON, missing
      metric behavior, trigger duration, and alert deployment errors.

  - category: alerts
    slug: alerts-terraform
    url: "https://docs.cloud.google.com/monitoring/alerts/terraform"
    description: >
      Use for native Google Terraform Provider alert policies or notification
      channels (`google_monitoring_alert_policy` and
      `google_monitoring_notification_channel`), IAM prerequisites, repeated
      notifications, and `terraform apply`; not for Sabre GKE CRD YAML.

  # ── DASHBOARDS ───────────────────────────────────────────────────────────
  - category: dashboards
    slug: gcp-foundation-dashboards
    url: "https://gitdocs.sabre.com/gitdocs/gcp-foundation/concepts/dashboards.html?format=markdown"
    description: >
      Use for Sabre GKE MonitoringDashboard CRD/Ansible YAML, repository
      placement, grid/mosaic layouts, widgets, legends, multi-cluster naming,
      or dashboard deployment errors and limits.

  # ── LOGS ─────────────────────────────────────────────────────────────────
  - category: logs
    slug: standards-logs
    url: "https://gitdocs.sabre.com/gitdocs/observability-docs/observability-standards/logs.html?format=markdown"
    description: >
      Use for application log structure and standard labels, asynchronous
      logging, PCI/PII masking or access control, Cloud Logging ingestion
      cost, GKE log optimization, log sinks, or logs versus log-based metrics.

  - category: logs
    slug: logging-starter-installation
    url: "https://gitdocs.sabre.com/gitdocs/ngp-starters/how-to-guides/logging-starter-installation.html?format=markdown"
    description: >
      Use when first adding the Logging NGP Starter dependency and
      logback-spring.xml base configuration to a Java service.

  # ── TRACING ────────────────────────────────────────────────────────────
  - category: tracing
    slug: standards-tracing
    url: "https://gitdocs.sabre.com/gitdocs/observability-docs/observability-standards/tracing.html?format=markdown"
    description: >
      Use for Sabre tracing purpose, Cloud Trace and OpenTelemetry direction,
      cross-service trace limitations, or recommended tracing tools.

  - category: tracing
    slug: adr-0046-e2e-tracing
    url: "https://gitdocs.sabre.com/gitdocs/adrs/adr-0046.html?format=markdown"
    description: >
      Use for the mandatory end-to-end tracing requirement for GKE applications
      in CERT/PROD, cross-service context propagation, sampling strategy, and
      minimum interaction tags.

  - category: tracing
    slug: tracing-starter-installation
    url: "https://gitdocs.sabre.com/gitdocs/ngp-starters/how-to-guides/tracing-starter-installation.html?format=markdown"
    description: >
      Use when first adding the Tracing NGP Starter dependency, required GCP
      properties, operations project, or CXF tracing support to a Java service.

  # ── METRICS ──────────────────────────────────────────────────────────────
  - category: metrics
    slug: gcp-application-metrics
    url: "https://gitdocs.sabre.com/gitdocs/syseng_team_page/main/how_to_guides/GCP_ApplicationMetrics.html?format=markdown"
    description: >
      Use to select concrete Micrometer/GMP metric names and tags for workload
      (HTTP, gRPC, PubSub, MOM, scheduled tasks), dependency (Resilience4j
      circuit breakers, HTTP/gRPC clients, Redis, Datastore, GCS), or resource
      (GKE, JVM, executors, Tomcat, HikariCP, cache) alerts and dashboards.

  - category: metrics
    slug: standards-metrics
    url: "https://gitdocs.sabre.com/gitdocs/observability-docs/observability-standards/metrics.html?format=markdown"
    description: >
      Use for policy or audit decisions about GMP and PromQL adoption, metric
      versus log/trace choice, label/cardinality and cost limits, client IDs,
      HTTP URI templates, platform versus custom metrics, or recommended
      metric categories; not for starter setup code.

  - category: metrics
    slug: metrics-starter-gmp
    url: "https://gitdocs.sabre.com/gitdocs/ngp-starters/how-to-guides/metrics-starter-GMP.html?format=markdown"
    description: >
      Use to enable or migrate Metrics NGP Starter to GMP, translate
      Stackdriver names/resources to `prometheus.googleapis.com` and
      `prometheus_target`, query histogram `_count/_sum/_bucket` series, remove
      MetricDescriptors, or fix missing-metric validation in PromQL alerts.

  - category: metrics
    slug: metrics-starter-concept
    url: "https://gitdocs.sabre.com/gitdocs/ngp-starters/concepts/metrics-starter.html?format=markdown"
    description: >
      Use when designing a metric's name, meter type, labels, cardinality, or
      startup value, or deciding whether a single event belongs in logs;
      not for Micrometer implementation examples.

  - category: metrics
    slug: metrics-starter-default-usage
    url: "https://gitdocs.sabre.com/gitdocs/ngp-starters/how-to-guides/metrics-starter-default-usage.html?format=markdown"
    description: >
      Use to enable or troubleshoot built-in HTTP client (`RestTemplateBuilder`),
      gRPC server/client (`@Service`, Spring gRPC, or interceptor), or Couchbase
      instrumentation, including URI-variable cardinality issues.

  - category: metrics
    slug: metrics-starter-custom-metrics
    url: "https://gitdocs.sabre.com/gitdocs/ngp-starters/how-to-guides/metrics-starter-custom-metrics.html?format=markdown"
    description: >
      Use when implementing a custom/business metric in Java with Micrometer
      `MeterRegistry`, Counter, Gauge, Timer, DistributionSummary, or
      LongTaskTimer after the metric design is already decided.

  - category: metrics
    slug: metrics-starter-installation
    url: "https://gitdocs.sabre.com/gitdocs/ngp-starters/how-to-guides/metrics-starter-installation.html?format=markdown"
    description: >
      Use when first adding the Metrics NGP Starter Maven dependency and
      required Spring/GCP properties, CXF dependencies, or Spring AI/LangGraph
      agent and token-usage metrics; not for post-install tuning.

  - category: metrics
    slug: metrics-starter-customization
    url: "https://gitdocs.sabre.com/gitdocs/ngp-starters/how-to-guides/metrics-starter-customization.html?format=markdown"
    description: >
      Use to tune an installed starter's actuator port/endpoints, Prometheus
      registry, HTTP/gRPC/CXF percentiles or histogram buckets, application
      error headers, HTTP URI-tag limit, or Couchbase gauge cache.

  - category: metrics
    slug: ops-agent-prometheus
    url: "https://docs.cloud.google.com/monitoring/agent/ops-agent/prometheus"
    description: >
      Use only to configure the Google Cloud Ops Agent Prometheus receiver on
      Compute Engine: scrape configs, receiver pipelines, relabeling, VM meta
      labels, ingestion verification, and sample/cardinality cost; not for GKE.
